# scheduler.yml - GitHub Actions workflow for manual/fallback inverter control tasks.
# Note: Scheduled cron runs have been migrated to Render.com + UptimeRobot for 24/7 exact-time execution.
name: Inverter Control (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      action_to_run:
        description: 'Select Command'
        required: true
        default: 'read-status'
        type: choice
        options:
          - read-status
          - set-solar
          - set-sbu
      ignore_date_skip:
        description: 'Override date restriction (24th-25th)?'
        type: boolean
        default: true

  # Schedule triggers migrated to Render 24/7 Web Service (kept commented out to prevent duplicate runs)
  # schedule:
  #   - cron: '0,10,20 21 * * *'  # Solar Logic (04:00, 04:10, 04:20 UTC+7)
  #   - cron: '30 11 * * *'       # SBU Logic (18:30 UTC+7)
  #   - cron: '0 */4 * * *'        # Status Check

jobs:
  execute-command:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Resolve Context
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "action=${{ github.event.inputs.action_to_run }}" >> $GITHUB_OUTPUT
            echo "force=${{ github.event.inputs.ignore_date_skip }}" >> $GITHUB_OUTPUT
          else
            echo "action=read-status" >> $GITHUB_OUTPUT
            echo "force=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Inverter Command
        env:
          INVERTER_TOKEN: ${{ secrets.INVERTER_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TIMEZONE: "Asia/Bangkok"
        run: |
          FORCE_FLAG=""
          if [[ "${{ steps.ctx.outputs.force }}" == "true" ]]; then
            FORCE_FLAG="--force"
          fi
          python inverter_control.py ${{ steps.ctx.outputs.action }} $FORCE_FLAG
